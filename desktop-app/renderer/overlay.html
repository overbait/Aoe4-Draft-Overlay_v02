<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AoE4 Draft Overlay - Overlay</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="overlay-body">
    <div class="overlay-root">
      <div class="overlay-row">
        <div class="overlay-card">
          <span class="label">Host</span>
          <strong>TIGER</strong>
        </div>
        <div class="overlay-card score">
          <span class="label">Score</span>
          <strong>1 : 0</strong>
        </div>
        <div class="overlay-card">
          <span class="label">Guest</span>
          <strong>SAS</strong>
        </div>
      </div>
      <div class="overlay-grid">
        <div class="overlay-card">
          <span class="label">Civ Picks</span>
          <ul>
            <li>French</li>
            <li>Ottomans</li>
            <li>Japanese</li>
          </ul>
        </div>
        <div class="overlay-card">
          <span class="label">Map Pool</span>
          <ul>
            <li>Dry Arabia</li>
            <li>Mountain Pass</li>
            <li>Golden Pit</li>
          </ul>
        </div>
      </div>
    </div>
  </body>
</html>
